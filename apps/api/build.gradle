plugins {
    id 'java'
    id 'war'
}

group 'com.kb.tangtang'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    springVersion  = '5.3.39'   // Spring Legacy(Spring MVC). Spring Boot 사용 금지 — 평가 감점
    mybatisVersion = '3.5.16'
    mybatisSpringVersion = '2.1.2'
    jacksonVersion = '2.17.2'
    log4jVersion   = '2.23.1'
    lombokVersion  = '1.18.34'
    junitVersion   = '5.10.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // ---- Spring Framework (Legacy / MVC) ----
    implementation("org.springframework:spring-context:${springVersion}") {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-tx:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation 'javax.inject:javax.inject:1'

    // ---- AOP ----
    implementation 'org.aspectj:aspectjrt:1.9.22'
    implementation 'org.aspectj:aspectjweaver:1.9.22'

    // ---- Servlet ----
    // JSP / JSTL 은 사용하지 않는다 (Vue3 SPA + REST 구조)
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'

    // ---- Logging ----
    implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-slf4j-impl:${log4jVersion}"
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4:1.16'

    // ---- XML 파싱(MyBatis 매퍼 내 한글 처리) ----
    implementation 'xerces:xercesImpl:2.12.2'

    // ---- Lombok ----
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // ---- JWT (jjwt) — Spring Boot 스타터가 아니므로 금지 기술이 아니다 ----
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ---- JSON ----
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    // ---- Database / MyBatis (JPA·Hibernate 사용 금지 — 평가 감점) ----
    implementation 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation "org.mybatis:mybatis:${mybatisVersion}"
    implementation "org.mybatis:mybatis-spring:${mybatisSpringVersion}"

    // ---- Test ----
    implementation "org.springframework:spring-test:${springVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    // 서블릿 API 는 main 이 compileOnly 라 테스트 클래스패스에 자동으로 오지 않는다.
    // MockHttpServletRequest 등을 쓰려면 테스트에도 따로 얹어야 한다.
    testCompileOnly 'javax.servlet:javax.servlet-api:4.0.1'
}

test {
    useJUnitPlatform()
}
